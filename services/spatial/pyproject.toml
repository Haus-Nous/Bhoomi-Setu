[project]
name = "bhoomi-setu-spatial"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3", "sqlalchemy>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhoomi_setu_spatial"]

