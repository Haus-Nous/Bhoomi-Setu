[project]
name = "bhoomi-setu-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<9", "ruff>=0.13,<1"]

[tool.uv.workspace]
members = ["services/*", "packages/domain-types/python", "packages/rules", "packages/lints"]

[tool.pytest.ini_options]
testpaths = ["services", "packages"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/ingest/src", "services/extraction/src", "services/validation/src", "services/spatial/src", "services/trust/src", "services/workflow/src", "services/identity/src", "services/evals/src", "packages/domain-types/python/src", "packages/rules/src", "packages/lints/src"]
