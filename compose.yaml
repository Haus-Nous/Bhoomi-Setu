name: bhoomi-setu

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhoomi_setu}
      POSTGRES_USER: ${POSTGRES_USER:-bhoomi_setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomi_setu}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bhoomi_setu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bhoomi_setu_dev}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

volumes:
  postgres-data:
  minio-data:
  redis-data:

