name: CI
on:
  pull_request:
  push:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: extractions/setup-just@v3
      - run: just setup
      - run: just check
      - run: just test

